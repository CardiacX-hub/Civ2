<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Kingdoms at War · Rendering Lab</title><style>body{margin:0;background:#15232a;color:#e2e7d9;font:16px system-ui}header{padding:14px;display:flex;gap:20px;align-items:center}canvas{width:100%;height:78vh;display:block}a{color:#9acbe0}label{display:flex;gap:8px}p{padding:0 16px}</style><header><a href="../">Back to game</a><label>Quality<select id="quality"><option>low</option><option selected>balanced</option><option>high</option></select></label><label>Wetness<input id="wet" type="range" min="0" max="1" step=".01" value="0"></label><label>Weathering<input id="wear" type="range" min="0" max="1" step=".01" value=".12"></label></header><canvas id="lab"></canvas><p id="status">Loading live 3D calibration scene…</p><script type="module">import{createDemo}from'./modern-renderer.bundle.js';let demo;function start(){demo?.stop();try{demo=createDemo(document.querySelector('#lab'),{quality:document.querySelector('#quality').value});window.demo=demo;document.querySelector('#status').textContent='Live geometry · cascaded shadows · GTAO contact shading · ACES · bloom · SMAA. Calibration assets, separate from sprite matches.';}catch(e){document.querySelector('#status').textContent='3D unavailable: '+e.message;}}document.querySelector('#quality').onchange=start;document.querySelector('#wet').oninput=e=>demo.weather.wetness.value=Number(e.target.value);document.querySelector('#wear').oninput=e=>demo.weather.weathering.value=Number(e.target.value);start();</script></html>
